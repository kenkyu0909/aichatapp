name: Local app offline tests
on:
  push:
    branches: [feat/ui-local-backend-v1]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q
      - run: node --check app.js
