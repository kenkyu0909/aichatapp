name: Local app offline tests

on:
  push:
    branches:
      - feat/ui-local-backend-v1
      - codex/full-system-verification
  pull_request:
    branches:
      - feat/ui-local-backend-v1
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Run backend tests
        run: python -m pytest -q --junitxml=test-results/pytest.xml
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-test-results
          path: test-results/pytest.xml
          if-no-files-found: ignore
