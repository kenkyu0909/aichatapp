name: Hourly GitHub Audit
on:
  schedule:
    # GitHub Actions cron is UTC; every hour at :00 is also every hour at :00 JST.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: hourly-github-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out directive branch
        uses: actions/checkout@v4
        with:
          ref: codex/directive-control
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect repository state and update directive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: kenkyu0909/aichatapp
        shell: bash
        run: |
          set -euo pipefail
          now="$(date -u '+%Y-%m-%d %H:%M UTC')"
          dev_sha="$(gh api "repos/${GH_REPO}/branches/codex/full-system-verification" --jq '.commit.sha')"
          pr_json="$(gh api "repos/${GH_REPO}/pulls/4")"
          pr_state="$(jq -r '.state' <<<"$pr_json")"
          pr_draft="$(jq -r '.draft' <<<"$pr_json")"
          pr_merged="$(jq -r '.merged' <<<"$pr_json")"
          pr_head="$(jq -r '.head.sha' <<<"$pr_json")"
          runs_json="$(gh api "repos/${GH_REPO}/actions/runs?branch=codex%2Ffull-system-verification&per_page=1")"
          run_id="$(jq -r '.workflow_runs[0].id // "none"' <<<"$runs_json")"
          run_status="$(jq -r '.workflow_runs[0].status // "none"' <<<"$runs_json")"
          run_conclusion="$(jq -r '.workflow_runs[0].conclusion // "pending/none"' <<<"$runs_json")"
          run_sha="$(jq -r '.workflow_runs[0].head_sha // "none"' <<<"$runs_json")"

          cat >> docs/verification/CODEX_CONTINUOUS_DIRECTIVE.md <<EOF

          ## Scheduled GitHub audit — ${now}
          - Development branch HEAD: ${dev_sha}
          - Draft PR #4: state=${pr_state}, draft=${pr_draft}, merged=${pr_merged}, PR head=${pr_head}
          - Latest Actions run for codex/full-system-verification: id=${run_id}, status=${run_status}, conclusion=${run_conclusion}, head_sha=${run_sha}
          - This is a factual repository-state snapshot only; CI success does not establish product-quality PASS. Review P0 failures and the latest quality evidence before declaring completion.
          - Safety constraints remain: do not merge PR #4; do not create conversation_004 or new conversation HTML without explicit permission; protect secrets, production data, billing, and approved API limits.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/verification/CODEX_CONTINUOUS_DIRECTIVE.md
          git commit -m "chore: record hourly GitHub audit snapshot"
          git push origin HEAD:codex/directive-control
