name: Gemini live smoke (fictional data only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemini-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_TEST }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL_TEST || 'gemini-3.5-flash-lite' }}
    steps:
      - name: Record skipped run when secret is missing
        if: env.GEMINI_API_KEY == ''
        run: |
          echo "SKIPPED: GEMINI_API_KEY_TEST is not configured; no real API request was made." >> "$GITHUB_STEP_SUMMARY"
      - name: Check out local application
        if: env.GEMINI_API_KEY != ''
        uses: actions/checkout@v4
      - name: Set up Python
        if: env.GEMINI_API_KEY != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        if: env.GEMINI_API_KEY != ''
        run: python -m pip install -r requirements.txt httpx
      - name: Run real Gemini reply and like tests
        if: env.GEMINI_API_KEY != ''
        run: python scripts/live_gemini_smoke.py
